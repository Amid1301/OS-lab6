name: PR Check

on:
  pull_request:
    branches: [ main ]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check README.md exists
        run: test -f README.md

      - name: Check workflow file exists
        run: test -f .github/workflows/pr-check.yml

      - name: On failure message
        if: failure()
        run: |
          echo "❌ Один из обязательных файлов отсутствует."
          exit 1
