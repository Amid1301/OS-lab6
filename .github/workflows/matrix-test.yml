name: Matrix Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tool version
        shell: bash
        run: |
          echo "OS: ${{ matrix.os }}"
          python --version || python3 --version
          node -v || echo "node not installed"

      - name: System info
        shell: bash
        run: |
          echo "Runner OS: $RUNNER_OS"
          uname -a || echo "not a Unix-like system"
